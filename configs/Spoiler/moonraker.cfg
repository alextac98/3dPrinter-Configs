[server]
host: 0.0.0.0
port: 7125
klippy_uds_address: /printer/printer_data/comms/klippy.sock

[authorization]
force_logins: False
trusted_clients:
    10.13.1.0/24
    127.0.0.0/8
    FE80::/10
    ::1/128
cors_domains:
    *.lan
    *.local
    *.printer.alextac.com
    *.home.alextac.com
    *://localhost
    *://localhost:*
    *://my.mainsail.xyz
    *://app.fluidd.xyz

[file_manager]
enable_object_processing: True

[octoprint_compat]

[history]

[update_manager]
channel: dev
refresh_interval: 168

[update_manager fluidd]
type: web
channel: stable
repo: fluidd-core/fluidd
path: /printer/fluidd

[update_manager fluidd-config]
type: git_repo
primary_branch: master
path: /printer/fluidd-config
origin: https://github.com/fluidd-core/fluidd-config.git
managed_services: klipper

# Crowsnest update_manager entry
[update_manager crowsnest]
type: git_repo
path: /printer/crowsnest
origin: https://github.com/mainsail-crew/crowsnest.git
managed_services: crowsnest
install_script: tools/pkglist.sh
