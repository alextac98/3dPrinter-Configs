
##################################################
# Spoiler Variables
##################################################

[gcode_macro _LIGHTS_VARS]

# L/R is in toolhead perspective
variable_toolhead_led_status_idx: 3
variable_toolhead_led_right_idx:  2
variable_toolhead_led_left_idx: 1

variable_colors: {
        'logo': {
            'filament_load': {'r': 0.0, 'g': 1.0, 'b': 0.0, 'w': 0.0},      # Green
            'filament_runout': {'r': 1.0, 'g': 0.55, 'b': 0.0, 'w': 0.0},   # Orange
            'off': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},                # Black
            'printing': {'r': 0.0, 'g': 0.0, 'b': 1.0, 'w': 0.0},           # Blue
            'default': {'r': 0.0, 'g': 0.0, 'b': 1.0, 'w': 0.0},            # Blue
        },
        'toolhead': {
            'off': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'default': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w':1.0},
        },
    }

gcode:


##################################################
# Includes
##################################################

# Fluidd Configs
[include ../fluidd.cfg]

# Macros
[include ../Macros/base_macros.cfg]
[include ../Macros/sensorless.cfg]
[include ../Macros/filament_macros.cfg]
[include ../Macros/nozzle.cfg]

# MCUs
[include cb1.cfg]
[include btt_manta_m8p.cfg]

# Toolheads
[include toolheads/yellow.cfg]

##################################################
# General Settings
##################################################

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 20000
max_z_velocity: 40
max_z_accel: 500
square_corner_velocity: 5.0

[probe]
x_offset: 0
y_offset: 0
z_offset: -1.125

[exclude_object]

[respond]

[pause_resume]

[idle_timeout]
timeout: 1800

[force_move]
enable_force_move: True

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 25, 25
mesh_max: 325, 325
probe_count: 5,5

[quad_gantry_level]
speed: 250
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.01
max_adjust: 10
gantry_corners:
	-60,-10
	410,420
points:
	100,  20
	100, 330
	250, 330
	250,  20

##################################################
# Extruder Settings
##################################################

[firmware_retraction]
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_length: 0.5
#   The speed of retraction, in mm/s. The default is 20 mm/s.
retract_speed: 40
#   The length (in mm) of *additional* filament to add when unretracting.
unretract_extra_length: 0
#   The speed of unretraction, in mm/s. The default is 10 mm/s.
unretract_speed: 40

[extruder]
nozzle_diameter: 0.4  		# mm
filament_diameter: 1.750    # mm
rotation_distance: 4.637
full_steps_per_rotation: 200
control: pid
pid_Kp: 35.406
pid_Ki: 8.430
pid_Kd: 37.176
min_temp: 0
max_temp: 280
max_extrude_only_distance: 200.0
max_extrude_only_velocity: 120
max_extrude_cross_section: 5

##################################################
# Bed Heater Settings
##################################################

[heater_bed]
max_power: 0.6
min_temp: 0
max_temp: 120
control: pid
pid_kp: 43.705
pid_ki: 1.301
pid_kd: 367.121

##################################################
# Motor Settings
##################################################

# B Stepper on Motor1
[stepper_x]
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
position_min: -3
position_endstop: -3
position_max: 354
homing_speed: 40
homing_retract_dist: 0

# A Stepper on Motor2
[stepper_y]
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
position_min: -9
position_endstop: 352
position_max: 352
homing_speed: 40
homing_retract_dist: 0

# Z0 Stepper on Motor4
[stepper_z]
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128
position_max: 340
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

# Z1 Stepper on Motor5
[stepper_z1]
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

# Z2 Stepper on Motor6
[stepper_z2]
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

# Z3 Stepper on Motor7
[stepper_z3]
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128