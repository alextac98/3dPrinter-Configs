##################################################
# LED Settings
##################################################

[neopixel case_lights]
pin: TopHat:PD3
color_order: WRGB
chain_count: 12
initial_RED: 0.0
initial_GREEN: 0.0
initial_BLUE: 0.0
initial_WHITE: 0.0
