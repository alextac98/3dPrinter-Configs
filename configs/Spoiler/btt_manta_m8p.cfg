
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_18003E000C51313339373836-if00


##################################################
# X/Y Stepper Settings
##################################################

## X Stepper on MOTOR0 (B Motor)
[stepper_x]
step_pin: PE6
dir_pin: PE5
enable_pin: !PC14
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF4
position_endstop: 0
position_max: 235
homing_speed: 50

[stepper_y]
step_pin: PE2
dir_pin: PE1
enable_pin: !PE4
microsteps: 16
rotation_distance: 40
endstop_pin: ^PF3
position_endstop: 0
position_max: 235
homing_speed: 50


##################################################
# Z Stepper Settings
##################################################

# Z0 Stepper - Front Left on MOTOR2_1
[stepper_z]
step_pin: PB4
dir_pin: PB3
enable_pin: !PB6
endstop_pin: ^PF1
position_endstop: 0
position_max: 270
position_min: -5.0
rotation_distance: 8.0
microsteps: 16

# Z1 Stepper - Rear Left on MOTOR2_2
# [stepper_z1]

##################################################
# Bed Heater Settings
##################################################

##################################################
# Fans
##################################################

[multi_pin controller_fan_pins]
# Pins: FAN3, FAN4
pins: PF8, PA4

# [controller_fan controller_fan]
# pin: multi_pin:controller_fan_pins
# max_power: 0.5
# header:
# stepper: stepper_x, stepper_y

[fan_generic controller_fan]
pin: multi_pin:controller_fan_pins
max_power: 1.0