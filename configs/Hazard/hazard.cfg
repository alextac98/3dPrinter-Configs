##################################################
# Includes
##################################################

# Fluid Configs
[include ../fluidd.cfg]

# MCUs
[include btt_octopus_pro.cfg]
[include btt_ebb_sb2209.cfg]
[include rpi4.cfg]

# Macros
[include ../Macros/base_macros.cfg]
[include ../Macros/sensorless.cfg]
[include ../Macros/filament_macros.cfg]
[include ../Macros/nozzle.cfg]

##################################################
# Variables
##################################################

##################################################
# General Settings
##################################################

[virtual_sdcard]
path: /home/hazard/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[printer]
kinematics: corexy
max_velocity: 500
max_accel: 20000
max_z_velocity: 40
max_z_accel: 500
square_corner_velocity: 5.0

[probe]
x_offset: 0
y_offset: 0
z_offset: -0.4

[exclude_object]

[respond]

[pause_resume]

[idle_timeout]
timeout: 1800

[force_move]
enable_force_move: True

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 25, 25
mesh_max: 325, 325
probe_count: 5,5

[quad_gantry_level]
speed: 250
horizontal_move_z: 10
retries: 10
retry_tolerance: 0.01
max_adjust: 10
gantry_corners:
	-60,-10
	410,420
points:
	100,  20
	100, 330
	250, 330
	250,  20

[input_shaper]
shaper_type_x: mzv
shaper_freq_x: 53.2
# Suggested max x accel: 8300mm/s^2
shaper_type_y: zv
shaper_freq_y: 39.4
# Suggested max y accel: 6000mm/s^2

[resonance_tester]
probe_points: 175, 175, 20
accel_chip: adxl345

##################################################
# Extruder Settings
##################################################

[firmware_retraction]
retract_length: 0.5
#   The length of filament (in mm) to retract when G10 is activated,
#   and to unretract when G11 is activated (but see
#   unretract_extra_length below). The default is 0 mm.
retract_speed: 40
#   The speed of retraction, in mm/s. The default is 20 mm/s.
unretract_extra_length: 0
#   The length (in mm) of *additional* filament to add when
#   unretracting.
unretract_speed: 40
#   The speed of unretraction, in mm/s. The default is 10 mm/s.

[extruder]
rotation_distance: 47.088
gear_ratio: 9:1
nozzle_diameter: 0.4  		# mm
filament_diameter: 1.750    # mm
control: pid
pid_Kp: 23.130
pid_Ki: 2.056
pid_Kd: 65.052
min_temp: 0
max_temp: 280
max_extrude_only_distance: 200.0
max_extrude_only_velocity: 30
max_extrude_cross_section: 5

##################################################
# Bed Heater Settings
##################################################

[heater_bed]
max_power: 0.6
min_temp: 0
max_temp: 120
control: pid
pid_kp: 39.206
pid_ki: 1.300
pid_kd: 295.512

##########################
##### Motor Settings #####
##########################

# B Stepper on Motor0
[stepper_x]
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
position_min: -1
position_endstop: -1
position_max: 351
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: False

# A Stepper on Motor1
[stepper_y]
rotation_distance: 40
microsteps: 32
full_steps_per_rotation: 200
position_min: -0.5
position_endstop: 361
position_max: 361
homing_speed: 40
homing_retract_dist: 0
homing_positive_dir: true

# Z0 Stepper on Motor2
[stepper_z]
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128
position_max: 340
position_min: -5
homing_speed: 8
second_homing_speed: 3
homing_retract_dist: 3

# Z1 Stepper on Motor3
[stepper_z1]
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

# Z2 Stepper on Motor4
[stepper_z2]
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128

# Z3 Stepper on Motor5
[stepper_z3]
rotation_distance: 40
gear_ratio: 80:16
microsteps: 128