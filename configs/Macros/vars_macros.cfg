[gcode_macro _CLIENT_VARIABLE]
variable_user_cancel_macro: "_end_chamber_fans"
gcode:

[gcode_macro _POSITION_VARS]
variable_park_pos: {
        'x': 0,
        'y': 350,
    }
gcode:

[gcode_macro _LIGHTS_VARS]
# L/R is in toolhead perspective
variable_toolhead_led_status_idx: 3
variable_toolhead_led_right_idx:  2
variable_toolhead_led_left_idx: 1

variable_colors: {
        'logo': {
            'filament_load': {'r': 0.0, 'g': 1.0, 'b': 0.0, 'w': 0.0},
            'filament_runout': {'r': 1.0, 'g': 0.55, 'b': 0.0, 'w': 0.0},
            'off': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'printing': {'r': 0.0, 'g': 0.0, 'b': 1.0, 'w': 0.0},
            'default': {'r': 0.0, 'g': 0.0, 'b': 1.0, 'w': 0.0},
        },
        'toolhead': {
            'off': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 0.0},
            'default': {'r': 0.0, 'g': 0.0, 'b': 0.0, 'w': 1.0},
        },
    }
gcode:

[gcode_macro _FILAMENT_VARS]
variable_park_x: 275
variable_park_y: 5
variable_park_z: 200

variable_default_temp: 240
variable_min_temp: 180

variable_unload_distance: 200
variable_unload_purge_distance: 50
variable_load_distance: 100
variable_load_retract_distance: 5
variable_purge_speed: 8

# Tip forming parameters
variable_cooling_tube_length: 15
variable_cooling_tube_retraction: 35
variable_initial_cooling_speed: 15
variable_final_cooling_speed: 25
variable_cooling_moves: 5
variable_unloading_speed_start: 25
variable_unloading_speed: 15
variable_ramming_volume: 0
gcode:
