[gcode_macro _FILAMENT_CHANGE_HEATUP]
gcode:
    {% set filament_vars = printer["gcode_macro _FILAMENT_VARS"] %}

    # Check to see if heated up. Heat to default temp if not
    {% if printer.extruder.temperature < filament_vars.min_temp %}
        M109 S{ filament_vars.default_temp }
    {% endif %}

[gcode_macro _TIP_FORM_GENERIC]
gcode:
    {% set params = printer["gcode_macro _FILAMENT_VARS"] %}
    
    SAVE_GCODE_STATE NAME=tip_form_state
    G91
    G92 E0

    SET_PRESSURE_ADVANCE ADVANCE=0

    # Retraction
    {% set total_retraction_distance = params.cooling_tube_retraction|float + params.cooling_tube_length|float / 2 - 15 %}
    G1 E-15 F{1.0 * params.unloading_speed_start|float * 60}
    G1 E-{0.7 * total_retraction_distance} F{1.0 * params.unloading_speed_start|float * 60}
    G1 E-{0.2 * total_retraction_distance} F{0.5 * params.unloading_speed_start|float * 60}
    G1 E-{0.1 * total_retraction_distance} F{0.3 * params.unloading_speed_start|float * 60}

    # Generate Cooling Moves
    {% set speed_inc = (params.final_cooling_speed|float - params.initial_cooling_speed|float) / (2 * params.cooling_moves|float - 1.0) %}
    {% for move in range(params.cooling_moves|int) %}
        G1 E{params.cooling_tube_length} F{(params.initial_cooling_speed|float + speed_inc * move * 2) * 60}
        G1 E-{params.cooling_tube_length} F{(params.initial_cooling_speed|float + speed_inc * (move * 2 + 1)) * 60}
    {% endfor %}

    G92 E0

    RESTORE_GCODE_STATE NAME=tip_form_state
