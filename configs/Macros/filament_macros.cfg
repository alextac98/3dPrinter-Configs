#################################################
#####            Filament Macros            #####
#################################################

####################################################
# Public Macros
####################################################

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set filament_vars = printer["gcode_macro _FILAMENT_VARS"] %}
    SAVE_GCODE_STATE NAME=unload_state                  # Save state to be able to revert back to it

    M83                                                 # Set to relative mode for extruder
    G92 E0                                              # Set extruder position to 0
    G1 E{filament_vars.unload_purge_distance} F{filament_vars.purge_speed * 60}     # Purge a bit to soften tip
    G1 E-{filament_vars.unload_distance} F{filament_vars.purge_speed * 60}          # Retract the rest of the way!

    RESTORE_GCODE_STATE NAME=unload_state

[gcode_macro LOAD_FILAMENT]
gcode:
    {% set filament_vars = printer["gcode_macro _FILAMENT_VARS"] %}
    SAVE_GCODE_STATE NAME=load_state
    
    M83                                                 # Set to relative mode for extruder
    G92 E0                                              # Set extruder position to 0
    G1 E{filament_vars.load_distance} F{filament_vars.purge_speed * 60}             # Load filament
    G1 E-{filament_vars.load_retract_distance} F{filament_vars.purge_speed * 60}    # Retract a bit to avoid oozing

    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro MOVE_TO_PURGE]
gcode:
    {% set filament_vars = printer["gcode_macro _FILAMENT_VARS"] %}
    # Check if we're homed, fail if not
    {% if printer.toolhead.homed_axes != "xyz" %}
        { action_raise_error("Please home XYZ first") }
    {% else %}
        G91
        G1 Z2 F3000
        G90
        G1 X{filament_vars.park_x} Y{filament_vars.park_y} Z{filament_vars.park_z} F7800
    {% endif %}

[gcode_macro _RUNOUT_PAUSE]
gcode:
    {% if printer.idle_timeout.state == "Printing" and not printer.pause_resume.is_paused %}
        PAUSE
    {% else %}
        RESPOND TYPE=echo MSG="Ignoring duplicate filament runout pause"
    {% endif %}

########################
# Private Macros
########################
[gcode_macro _FILAMENT_RUNOUT]
gcode:
    { action_respond_info("RUNOUT: Filament runout") }
    _SET_TOOLHEAD_STATUS_LED mode="filament_runout"
    {% if printer.idle_timeout.state == "Printing" %}
        M118 {printer.idle_timeout.state}
        PAUSE
    {% endif %}
    {% if printer.toolhead.homed_axes == "xyz" %}
        MOVE_TO_PURGE
    {% endif %}
    

[gcode_macro _FILAMENT_INSERT]
gcode:
    { action_respond_info("RUNOUT: Filament inserted") }
    _SET_TOOLHEAD_STATUS_LED mode="filament_load"
    _FILAMENT_LOAD
    _SET_TOOLHEAD_STATUS_LED mode="default"


